<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme Notes — Capture ideas fast</title>
  <meta name="description" content="A tiny notes app for fast thinkers.">
  <style>
    body { color: #111827; background: #ffffff; font-family: Inter, system-ui, sans-serif; }
    .hero { background: #4f46e5; color: #f9fafb; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/pricing.html">Pricing</a>
    <a href="/docs.html">Docs</a>
  </nav>
  <main>
    <h1>Capture ideas fast</h1>
    <h2>Your second brain, minus the clutter</h2>
    <p>Write it down before it is gone.</p>
    <button>Get started free</button>
    <button>Watch the demo</button>
    <form action="/signup" method="post">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" required>
      <input name="plan" type="hidden" value="free">
      <button type="submit">Create account</button>
    </form>
    <img src="/hero.png" alt="Notes dashboard preview">
  </main>
